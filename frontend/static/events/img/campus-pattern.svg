      <path d="M8 14 H26 M8 22 H26 M42 14 H60 M42 22 H60"/>
    </g>
    <!-- pencil -->
    <g transform="translate(120 70) rotate(35)">
      <rect x="0" y="0" width="12" height="56" rx="2"/>
      <path d="M0 56 L6 70 L12 56"/>
      <path d="M0 8 H12"/>
