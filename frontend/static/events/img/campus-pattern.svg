    <!-- lightbulb -->
    <g transform="translate(260 110)">
      <path d="M14 0 C4 0 -2 8 0 17 C1 23 6 26 7 32 H21 C22 26 27 23 28 17 C30 8 24 0 14 0 Z"/>
